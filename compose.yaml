name: reelbox
x-backend: &backend
  build: ./backend
  environment: &environment
    API_TOKEN: ${API_TOKEN:?Run scripts/setup.sh first}
    DATA_DIR: /data
    DOWNLOAD_ROOT: /downloads
    DOWNLOAD_HOST_PATH: ${DOWNLOAD_HOST_DIR:-${PWD}/downloads}
    REDIS_URL: redis://redis:6379/0
    MAX_FILE_BYTES: ${MAX_FILE_BYTES:-4294967296}
    MIN_FREE_BYTES: ${MIN_FREE_BYTES:-1073741824}
    MAX_JOBS: ${MAX_JOBS:-50000}
    EGRESS_PROXY: http://egress:8899
  volumes:
    - library-data:/data
    - ${DOWNLOAD_HOST_DIR:-./downloads}:/downloads
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  egress:
    build: ./backend
    command: [python, -m, app.egress]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    <<: *backend
  worker:
    <<: *backend
    command: [rq, worker, --url, 'redis://redis:6379/0', downloads, metadata, reelbox]
    deploy:
      replicas: 3
  maintenance:
    <<: *backend
    command: [python, -m, app.maintenance]
  web:
    build: ./frontend
    environment:
      API_BASE: http://api:8000
      API_TOKEN: ${API_TOKEN}
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on: [api]
    restart: unless-stopped
volumes:
  redis-data:
  library-data:
