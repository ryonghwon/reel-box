<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <title>Reel Box</title>
    <style>
      :root {
        color-scheme: only light;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #f5f5f5;
        color: #292929;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .box {
        text-align: center;
      }
      .mark {
        margin: auto auto 22px;
        display: grid;
        place-items: center;
        background: #262626;
        color: white;
        border-radius: 16px;
        font-size: 38px;
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
      }
      p {
        font-size: 13px;
        color: #888;
      }
      .line {
        width: 180px;
        height: 3px;
        background: #e3e3e3;
        border-radius: 3px;
        margin: 25px auto;
        overflow: hidden;
      }
      .line:after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #086bd8;
        animation: load 1.4s infinite;
      }
      @keyframes load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(330%);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="assets/icon.png" width="88" height="88" alt="" />
      <h1>Reel Box</h1>
      <p>라이브러리를 여는 중…</p>
      <div class="line"></div>
      <p>잠시 후 앱이 열립니다.</p>
    </div>
  </body>
</html>
