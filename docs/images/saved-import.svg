<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#f4f5f7"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="52" font-size="13" fill="#747b85" font-weight="600">REEL BOX / PRODUCT GUIDE</text><text x="64" y="105" font-size="36" fill="#22262b" font-weight="600">Bring saved posts into your library</text><text x="64" y="140" font-size="18" fill="#656d78" font-weight="400">Read an Instagram export, review the links, and download the media you need.</text><rect x="64" y="178" width="1472" height="746" rx="14" fill="#fff" stroke="#dfe2e6"/><rect x="88" y="199" width="32" height="32" rx="7" fill="#25282c" stroke="#25282c"/><svg x="92" y="203" width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M12 2a7 7 0 0 0-6.7 9H3v8a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-8h-2.3A7 7 0 0 0 12 2Zm0 2a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 12 4ZM8.5 8.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2Zm7 0a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2ZM12 8a1 1 0 1 1 0 2 1 1 0 0 1 0-2ZM5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6h-4v2H9v-2H5Z"/></svg><text x="132" y="222" font-size="22" fill="#26292d" font-weight="600">Reel Box</text><text x="88" y="958" font-size="13" fill="#838a94" font-weight="400">Illustrated interface · Example media only</text><path d="M64 250h1472" stroke="#e6e8eb"/><rect x="65" y="251" width="227" height="672" rx="0" fill="#fafafa" stroke="none"/><path d="M292 250v674" stroke="#e2e5e9"/><text x="88" y="291" font-size="16" fill="#343a42" font-weight="600">Personal library</text><text x="88" y="315" font-size="13" fill="#969da6" font-weight="400">My computer</text><text x="89" y="352" font-size="11" fill="#9ba1aa" font-weight="400">WORKSPACE</text><text x="89" y="391" font-size="15" fill="#727b85" font-weight="400">Library</text><rect x="77" y="407" width="202" height="36" rx="6" fill="#e8eff8" stroke="none"/><text x="89" y="432" font-size="14" fill="#396c9f" font-weight="600">Instagram saved posts</text><text x="89" y="473" font-size="15" fill="#727b85" font-weight="400">Screen recorder</text><text x="89" y="525" font-size="11" fill="#9ba1aa" font-weight="400">PLATFORMS</text><text x="89" y="565" font-size="15" fill="#727b85" font-weight="400">Instagram</text><text x="89" y="602" font-size="15" fill="#727b85" font-weight="400">YouTube</text><text x="89" y="639" font-size="15" fill="#727b85" font-weight="400">Vimeo</text><text x="89" y="676" font-size="15" fill="#727b85" font-weight="400">TikTok</text><text x="89" y="713" font-size="11" fill="#9ba1aa" font-weight="400">X</text><text x="89" y="750" font-size="15" fill="#727b85" font-weight="400">Threads</text><text x="89" y="787" font-size="15" fill="#727b85" font-weight="400">Facebook</text><text x="89" y="842" font-size="15" fill="#727b85" font-weight="400">Storage settings</text><path d="M81 866h196" stroke="#e6e8eb"/><path d="M89 881h7l3 3h12v14h-22z" fill="none" stroke="#7d858f" stroke-width="1.7" stroke-linejoin="round"/><text x="122" y="897" font-size="13" fill="#626d78" font-weight="400">Open download folder</text><text x="330" y="302" font-size="27" fill="#2f3740" font-weight="600">Instagram saved posts</text><text x="330" y="335" font-size="17" fill="#8a949f" font-weight="400">Bring your saved posts into one library.</text><rect x="330" y="371" width="715" height="470" rx="12" fill="#fff" stroke="#dfe2e6"/><text x="356" y="410" font-size="20" fill="#3a434d" font-weight="600">Import saved posts</text><text x="852" y="410" font-size="13" fill="#8b96a2" font-weight="400">ZIP · JSON · HTML</text><rect x="356" y="434" width="663" height="222" rx="9" fill="#f8fafd" stroke="#98b5d9" stroke-dasharray="5 5"/><path d="M687 468v37m-13-24 13-13 13 13m-32 13v21h38v-21" stroke="#7c99bd" stroke-width="2" fill="none"/><text x="547" y="550" font-size="20" fill="#485462" font-weight="600">Choose an Instagram export</text><text x="493" y="582" font-size="16" fill="#9aa5b0" font-weight="400">Select the ZIP archive or a saved_posts file</text><rect x="619" y="602" width="145" height="38" rx="7" fill="#fff" stroke="#dfe2e6"/><text x="633" y="627" font-size="16" fill="#34383d" font-weight="550">Choose file</text><text x="357" y="692" font-size="15" fill="#7b8997" font-weight="400">Up to 32 MB. Files are read locally.</text><text x="357" y="719" font-size="15" fill="#7b8997" font-weight="400">Links and progress are kept so an import can be resumed.</text><rect x="356" y="754" width="18" height="18" rx="4" fill="#0a6cda" stroke="#0a6cda"/><path d="M360 763l4 4 7-9" stroke="#fff" stroke-width="1.7" fill="none"/><text x="387" y="770" font-size="16" fill="#4d5967" font-weight="400">Download imported media automatically</text><text x="387" y="800" font-size="14" fill="#929eaa" font-weight="400">Turn off to review each item before downloading.</text><text x="1090" y="406" font-size="21" fill="#333d49" font-weight="600">Export from Instagram</text><rect x="1090" y="436" width="25" height="25" rx="13" fill="#eef2f6" stroke="none"/><text x="1098" y="454" font-size="13" fill="#8898a9" font-weight="600">1</text><text x="1128" y="454" font-size="16" fill="#536170" font-weight="600">Open Accounts Center</text><text x="1128" y="479" font-size="14" fill="#8a97a5" font-weight="400">Go to Your information</text><text x="1128" y="499" font-size="14" fill="#8a97a5" font-weight="400">and permissions.</text><rect x="1090" y="531" width="25" height="25" rx="13" fill="#eef2f6" stroke="none"/><text x="1098" y="549" font-size="13" fill="#8898a9" font-weight="600">2</text><text x="1128" y="549" font-size="16" fill="#536170" font-weight="600">Select Saved</text><text x="1128" y="574" font-size="14" fill="#8a97a5" font-weight="400">Export saved posts to</text><text x="1128" y="594" font-size="14" fill="#8a97a5" font-weight="400">your device.</text><rect x="1090" y="626" width="25" height="25" rx="13" fill="#eef2f6" stroke="none"/><text x="1098" y="644" font-size="13" fill="#8898a9" font-weight="600">3</text><text x="1128" y="644" font-size="16" fill="#536170" font-weight="600">Choose all time and JSON</text><text x="1128" y="669" font-size="14" fill="#8a97a5" font-weight="400">Request the full date range</text><text x="1128" y="689" font-size="14" fill="#8a97a5" font-weight="400">and wait for the export.</text><rect x="1090" y="721" width="25" height="25" rx="13" fill="#eef2f6" stroke="none"/><text x="1098" y="739" font-size="13" fill="#8898a9" font-weight="600">4</text><text x="1128" y="739" font-size="16" fill="#536170" font-weight="600">Choose the file here</text><text x="1128" y="764" font-size="14" fill="#8a97a5" font-weight="400">Reel Box reads the links</text><text x="1128" y="784" font-size="14" fill="#8a97a5" font-weight="400">and checks available media.</text><text x="64" y="1004" font-size="18" fill="#30363d" font-weight="600">Local import</text><text x="64" y="1036" font-size="15" fill="#6d7580" font-weight="400">The export archive stays on your computer.</text><text x="564" y="1004" font-size="18" fill="#30363d" font-weight="600">Duplicate checks</text><text x="564" y="1036" font-size="15" fill="#6d7580" font-weight="400">Matching links already in the library are skipped.</text><text x="1064" y="1004" font-size="18" fill="#30363d" font-weight="600">Resume a long list</text><text x="1064" y="1036" font-size="15" fill="#6d7580" font-weight="400">Keep import progress without adding it twice.</text></g></svg>