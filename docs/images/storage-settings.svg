<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#f4f5f7"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="52" font-size="13" fill="#747b85" font-weight="600">REEL BOX / PRODUCT GUIDE</text><text x="64" y="105" font-size="36" fill="#22262b" font-weight="600">Your files, in the folder you choose</text><text x="64" y="140" font-size="18" fill="#656d78" font-weight="400">Keep media on disk and let Reel Box manage its source records and previews.</text><rect x="64" y="178" width="1472" height="746" rx="14" fill="#fff" stroke="#dfe2e6"/><rect x="88" y="199" width="32" height="32" rx="7" fill="#25282c" stroke="#25282c"/><svg x="92" y="203" width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M12 2a7 7 0 0 0-6.7 9H3v8a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-8h-2.3A7 7 0 0 0 12 2Zm0 2a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 12 4ZM8.5 8.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2Zm7 0a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2ZM12 8a1 1 0 1 1 0 2 1 1 0 0 1 0-2ZM5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6h-4v2H9v-2H5Z"/></svg><text x="132" y="222" font-size="22" fill="#26292d" font-weight="600">Reel Box</text><text x="88" y="958" font-size="13" fill="#838a94" font-weight="400">Illustrated interface · Example media only</text><path d="M64 250h1472" stroke="#e6e8eb"/><rect x="65" y="251" width="227" height="672" rx="0" fill="#fafafa" stroke="none"/><path d="M292 250v674" stroke="#e2e5e9"/><text x="88" y="291" font-size="16" fill="#343a42" font-weight="600">Personal library</text><text x="88" y="315" font-size="13" fill="#969da6" font-weight="400">My computer</text><text x="89" y="352" font-size="11" fill="#9ba1aa" font-weight="400">WORKSPACE</text><text x="89" y="391" font-size="15" fill="#727b85" font-weight="400">Library</text><text x="89" y="432" font-size="14" fill="#727b85" font-weight="400">Instagram saved posts</text><text x="89" y="473" font-size="15" fill="#727b85" font-weight="400">Screen recorder</text><text x="89" y="525" font-size="11" fill="#9ba1aa" font-weight="400">PLATFORMS</text><text x="89" y="565" font-size="15" fill="#727b85" font-weight="400">Instagram</text><text x="89" y="602" font-size="15" fill="#727b85" font-weight="400">YouTube</text><text x="89" y="639" font-size="15" fill="#727b85" font-weight="400">Vimeo</text><text x="89" y="676" font-size="15" fill="#727b85" font-weight="400">TikTok</text><text x="89" y="713" font-size="11" fill="#9ba1aa" font-weight="400">X</text><text x="89" y="750" font-size="15" fill="#727b85" font-weight="400">Threads</text><text x="89" y="787" font-size="15" fill="#727b85" font-weight="400">Facebook</text><rect x="77" y="817" width="202" height="36" rx="6" fill="#e8eff8" stroke="none"/><text x="89" y="842" font-size="15" fill="#396c9f" font-weight="600">Storage settings</text><path d="M81 866h196" stroke="#e6e8eb"/><path d="M89 881h7l3 3h12v14h-22z" fill="none" stroke="#7d858f" stroke-width="1.7" stroke-linejoin="round"/><text x="122" y="897" font-size="13" fill="#626d78" font-weight="400">Open download folder</text><text x="332" y="303" font-size="27" fill="#2f3740" font-weight="600">Storage settings</text><text x="332" y="337" font-size="17" fill="#8a949f" font-weight="400">Choose where media files are stored and how long they are kept.</text><rect x="330" y="374" width="1148" height="473" rx="12" fill="#fff" stroke="#dfe2e6"/><text x="359" y="416" font-size="21" fill="#35404c" font-weight="600">Download folder</text><text x="359" y="448" font-size="16" fill="#83909e" font-weight="400">Files are saved directly to this folder. The library keeps their records and previews.</text><rect x="359" y="471" width="1090" height="81" rx="8" fill="#f8f9fb" stroke="#e9edf1"/><path d="M381 497h7l3 3h12v14h-22z" fill="none" stroke="#7d858f" stroke-width="1.7" stroke-linejoin="round"/><text x="419" y="514" font-size="17" fill="#687686" font-weight="400">/Media/Reel Box</text><rect x="1124" y="490" width="139" height="38" rx="7" fill="#fff" stroke="#dfe2e6"/><text x="1138" y="515" font-size="16" fill="#34383d" font-weight="550">Open folder</text><rect x="1274" y="490" width="151" height="38" rx="7" fill="#fff" stroke="#dfe2e6"/><text x="1288" y="515" font-size="16" fill="#34383d" font-weight="550">Change folder</text><text x="359" y="580" font-size="15" fill="#8793a1" font-weight="400">A new location applies to newly added items. Existing files stay where they are.</text><path d="M359 610h1090" stroke="#e6e8eb"/><text x="359" y="647" font-size="16" fill="#41464d" font-weight="550">Auto-delete</text><rect x="359" y="660" width="430" height="40" rx="10" fill="#fff" stroke="#dfe2e6"/><text x="372" y="686" font-size="17" fill="#24272b" font-weight="400">Keep until deleted</text><text x="359" y="731" font-size="15" fill="#8793a1" font-weight="400">Files stay until you delete them. Saving this option also clears existing expiry dates.</text><path d="M359 760h1090" stroke="#e6e8eb"/><text x="359" y="799" font-size="17" fill="#4a5868" font-weight="550">›  Advanced</text><rect x="1296" y="789" width="152" height="38" rx="7" fill="#086bd8" stroke="#086bd8"/><text x="1310" y="814" font-size="16" fill="#fff" font-weight="550">Save settings</text><text x="64" y="1004" font-size="18" fill="#30363d" font-weight="600">Choose a destination</text><text x="64" y="1036" font-size="15" fill="#6d7580" font-weight="400">Use a local folder or a connected external drive.</text><text x="564" y="1004" font-size="18" fill="#30363d" font-weight="600">Keep files by default</text><text x="564" y="1036" font-size="15" fill="#6d7580" font-weight="400">Automatic deletion is an explicit choice.</text><text x="1064" y="1004" font-size="18" fill="#30363d" font-weight="600">Save copies elsewhere</text><text x="1064" y="1036" font-size="15" fill="#6d7580" font-weight="400">Export files without breaking library references.</text></g></svg>